<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aplicación Producto</title>

     <!--BOOTSTRAP CDN:)-->
    <link rel="stylesheet" href="https://bootswatch.com/4/litera/bootstrap.min.css">

</head>
<body>

    <!--NAVEGACIÓN-->
    <nav class="navbar navbar-light bg-light">
        <a href= "/" class="navbar-brand">
            Aplicación Producto
        </a>
    </nav>

    
    <div class= "container">

         <!--APLICACION-->
        <div id= "app" class="row pt-5">
            <div clas="col-md-4">
                <div class="card">
                    <div class= "card-header">
                        <h4>Agrega un Producto</h4>

                    </div>
                    <form id="formulario-producto" class="card-body">
                        <div class="form.group">

                            <input type="text" id="name" placeholder="Nombre del Producto"
                            class="form-control">
                        </div>
                        <div class="form-group">
                            <input type="number" id="price" placeholder="Precio del Producto" 
                            class="form-control">
                            
                        </div>
                    </form>
                </div>
            </div>


            <div clas="col-md-8">
                
            </div>
        

        </div>
    </div>
</body>
</html>
