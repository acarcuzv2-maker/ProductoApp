<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
</head>

<body>

    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-light bg-light border">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">Catálogo</a>
        </div>
    </nav>

    <div class="container">

        <!-- APLICACIÓN -->
        <div id="App" class="row pt-5 justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">Nuevo</div>

                        <form id="product-form" class="card-body" novalidate>
                            <h2 class="fw-bold mb-3">Producto</h2>

                            <div class="form-floating mb-3">
                                <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                                <label for="nombre">Nombre</label>
                                <div class="invalid-feedback">Por favor, elija un nombre para el producto</div>
                            </div>

                            <div class="input-group has-validation mb-3">
                                <span class="input-group-text">Q.</span>
                                <input type="number" step="0.01" id="precio" class="form-control" placeholder="Precio">
                                <div class="invalid-feedback">Por favor, ingrese un precio</div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" id="año" min="2020" max="2100" value="2026"
                                    class="form-control" placeholder="Año">
                                <label for="año">Año</label>
                                <div class="invalid-feedback">Por favor, ingrese un año</div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Agregar</button>
                            </div>
                        </form>
                </div>
            </div>

            <div id="lista-productos" class="col-md-4"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
