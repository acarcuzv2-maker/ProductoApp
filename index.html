<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aplicación Producto</title>

     <!--BOOTSTRAP CDN:)-->
    <link rel="stylesheet" href="https://bootswatch.com/4/cyborg/bootstrap.min.css">
</head>

<body>

    <!--NAVEGACIÓN-->
    <nav class="navbar navbar-light bg-light">
        <a href= "/" class="navbar-brand">
            Aplicación Producto
        </a>
    </nav>

    
    <div class= "container">

         <!--APLICACION-->
        <div id= "app" class="row pt-5">
            <div clas="col-md-4">
                <div class="card">
                    <div class= "card-header">
                        <h4>Agrega un Producto</h4>

                    </div>
                    <form id="product-form" class="card-body">
                        <div class="form-group">

                            <input type="text" id="nombre" placeholder="Nombre del Producto"
                            class="form-control">
                        </div>
                        <div class="form-group" >
                            <input type="number" step="0.01" id="precio" placeholder="Precio del Producto" 
                            class="form-control">
                        </div>
                        <div class="form-group">
                            <input type="number" id="año" min="2020" value="2026" max="2100" placeholder="Año del Producto" class="form-control">
                        </div>
                        <input type="submit" value="Guardar" class="btn btn-primary btn-block">
                    </form>
                </div>
            </div>
            <div id="lista-productos" class="col-md-8">
                
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    
</body>
</html>
